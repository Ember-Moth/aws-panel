{{define "dashboard"}}
      <div class="page-header d-print-none">
        <div class="container-xl">
          <div class="row align-items-center g-3">
            <div class="col">
              <div class="page-pretitle">WORKSPACE</div>
              <h1 class="page-title">工作台</h1>
              <div class="text-secondary mt-2">集中管理团队的 AWS 账号、资源与操作。</div>
            </div>
            <div class="col-auto">
              <button class="btn btn-outline-secondary" type="button"
                hx-get="/partials/system-status" hx-target="#system-status" hx-swap="outerHTML"
                hx-disabled-elt="this" hx-indicator="#refresh-spinner">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 18 17"/></svg>
                刷新状态
                <span id="refresh-spinner" class="spinner-border spinner-border-sm htmx-indicator ms-2" aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="page-body">
        <div class="container-xl">
          <div id="connection-error" class="alert alert-danger d-none" role="alert">服务连接中断，以下状态可能已过期。请稍后刷新。</div>
          <div class="row row-cards">
            <div class="col-lg-8">
              <section class="card welcome-card">
                <div class="card-body">
                  <span class="workspace-mark mb-4" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                  </span>
                  <div><span class="badge bg-blue-lt">团队工作区</span></div>
                  <h2 class="mt-3 mb-3">查看团队的 AWS 资源</h2>
                  <p class="text-secondary welcome-description">按账号和区域查看 Lightsail 实例与区域状态，通过任务同步最新数据，并跟踪每个范围的刷新结果。</p>
                  <div class="btn-list mb-4"><a class="btn btn-primary" href="/resources">查看资源</a><a class="btn" href="/accounts">管理 AWS 连接</a></div>
                  <p class="small text-secondary mb-0">首次使用前，请配置并验证访问连接。区域启用和 Lightsail 创建入口位于资源工作台，云端写入需由管理员显式启用。</p>
                </div>
              </section>
            </div>
            <div class="col-lg-4">
              {{template "system-status" .}}
            </div>
          </div>
        </div>
      </div>
{{end}}
