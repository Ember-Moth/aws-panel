name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_DB: aws_panel_test
          POSTGRES_USER: aws_panel
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aws_panel -d aws_panel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check
        env:
          AWS_PANEL_TEST_DB_PORT: "5432"
          AWS_PANEL_TEST_DB_PASSWORD: test-only-password
        run: make check
      - name: Race tests
        env:
          AWS_PANEL_TEST_DB_PORT: "5432"
          AWS_PANEL_TEST_DB_PASSWORD: test-only-password
        run: make test-race
      - name: Build
        run: make build
