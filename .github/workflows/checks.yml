name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_DB: aws_panel_test
          POSTGRES_USER: aws_panel_migrator
          POSTGRES_PASSWORD: test-only-migration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aws_panel_migrator -d aws_panel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Initialize runtime database role
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          POSTGRES_USER: aws_panel_migrator
          POSTGRES_DB: aws_panel_test
          PGPASSWORD: test-only-migration-password
          AWS_PANEL_DB_PASSWORD: test-only-runtime-password
        run: sh deploy/postgres-init.sh
      - name: Check
        env:
          AWS_PANEL_TEST_DB_PORT: "5432"
          AWS_PANEL_TEST_DB_PASSWORD: test-only-runtime-password
          AWS_PANEL_TEST_MIGRATION_USER: aws_panel_migrator
          AWS_PANEL_TEST_MIGRATION_PASSWORD: test-only-migration-password
          AWS_PANEL_TEST_REDIS_ADDRESS: 127.0.0.1:6379
        run: make check
      - name: Race tests
        env:
          AWS_PANEL_TEST_DB_PORT: "5432"
          AWS_PANEL_TEST_DB_PASSWORD: test-only-runtime-password
          AWS_PANEL_TEST_MIGRATION_USER: aws_panel_migrator
          AWS_PANEL_TEST_MIGRATION_PASSWORD: test-only-migration-password
          AWS_PANEL_TEST_REDIS_ADDRESS: 127.0.0.1:6379
        run: make test-race
      - name: Build
        run: make build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Container initialization and recovery acceptance
        run: python3 scripts/compose-smoke.py --report .local/compose-acceptance.json

  # Publishes only commits that passed both jobs: main and v* tags, never pull requests.
  image:
    needs: [go, compose]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.name.outputs.revision }}
            BUILD_TIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
